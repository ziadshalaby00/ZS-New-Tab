<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>New Tab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Preload script — runs before the stylesheet to prevent accent-color flash.
     Keep inline and synchronous to avoid delaying first paint.
     Must stay in sync with ZSCore.applyAccent() in script.core.js.
     ES5/no dependencies intentionally keeps it tiny. -->
    <script>
        (function () {
            try {
                var raw = localStorage.getItem('ZSNewTab.settings');
                if (!raw) return;

                var settings = JSON.parse(raw).settings;
                if (!settings || !settings.accent) return;

                var hex = String(settings.accent).trim().replace(/^#/, '');
                if (hex.length === 3) {
                    hex = hex.split('').map(function (c) { return c + c; }).join('');
                }
                if (!/^[0-9a-f]{6}$/i.test(hex)) return;

                var r = parseInt(hex.slice(0, 2), 16);
                var g = parseInt(hex.slice(2, 4), 16);
                var b = parseInt(hex.slice(4, 6), 16);

                var root = document.documentElement;
                root.style.setProperty('--accent', '#' + hex);
                root.style.setProperty('--accent-rgb', r + ', ' + g + ', ' + b);

                // Perceived brightness → pick readable text on top of the accent.
                var brightness = 0.299 * r + 0.587 * g + 0.114 * b;
                root.style.setProperty(
                    '--accent-contrast',
                    brightness > 150 ? '#1a1408' : '#ffffff'
                );
            } catch (e) {
                /* Fail silently — the CSS defaults in :root will take effect. */
            }
        })();
    </script>

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
    <!-- ============================================
         1. TOP BAR (SETTINGS & CONTROLS)
         ============================================ -->
    <div class="top-bar">
        <button class="icon-btn" id="settingsToggle" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>
    </div>

    <!-- ============================================
         2. MAIN APP CONTAINER
         ============================================ -->
    <div class="app">

        <!-- Greeting Section -->
        <div class="hero">
            <div class="greeting" id="greeting">
                <span id="greetingMessage">Hi, </span><span class="name" id="greetName">there</span>
            </div>
        </div>

        <!-- Search Form -->
        <form class="search" id="searchForm" autocomplete="off">
            <select id="engineSelect">
                <option value="https://www.google.com/search?q=">Google</option>
                <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
                <option value="https://search.brave.com/search?q=">Brave</option>
                <option value="https://www.bing.com/search?q=">Bing</option>
            </select>
            <input id="searchInput" type="text" placeholder="Search or type a URL" autofocus>
            <button type="submit" title="Search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="m21 21-4.3-4.3"/>
                </svg>
            </button>
        </form>

        <!-- Site Grid with Navigation Buttons -->
        <div class="grid-wrap">
            <button class="page-nav" id="prevPage" title="Previous page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m15 18-6-6 6-6"/>
                </svg>
            </button>
            
            <div class="grid" id="grid"></div>
            
            <button class="page-nav" id="nextPage" title="Next page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m9 18 6-6-6-6"/>
                </svg>
            </button>
        </div>

        <!-- Pagination Dots -->
        <div class="dots" id="dots"></div>

    </div>

    <!-- ============================================
         3. SETTINGS PANEL (SLIDE-OUT)
         ============================================ -->
    <aside class="panel" id="panel">
        <button class="panel-close" id="panelClose" title="Close settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6 6 18"/>
                <path d="m6 6 12 12"/>
            </svg>
        </button>

        <h2>Settings</h2>

        <!-- Display Name -->
        <div class="field">
            <label for="displayName">Your name</label>
            <input type="text" id="displayName" placeholder="User">
        </div>

        <!-- Grid Dimensions (Rows & Columns) -->
        <div class="row2">
            <div class="field">
                <label for="rowsInput">Rows per page</label>
                <input type="number" id="rowsInput" min="1" max="20">
            </div>
            <div class="field">
                <label for="colsInput">Columns per page</label>
                <input type="number" id="colsInput" min="1" max="20">
            </div>
        </div>

        <!-- Accent color palette -->
        <div class="field">
            <label>Accent color</label>
            <div class="swatches" id="swatches"></div>
        </div>

        <div class="field">
            <label for="customAccent">Custom color</label>
            <input type="color" id="customAccent" value="#e8a33d">
        </div>

        <!-- Background Image Upload -->
        <div class="field">
            <label for="bgImageInput">Background image</label>
            <input type="file" id="bgImageInput" accept="image/*">
        </div>
        <div class="hint">
            Choose an image from your device. Leave empty to use the default dark background.
        </div>
        <button class="btn danger" id="removeBgBtn">Remove background</button>

        <hr>

        <!-- Export / Import Backup -->
        <button class="btn" id="exportBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <path d="M7 10l5 5 5-5"/>
                <path d="M12 15V3"/>
            </svg>
            Export backup (.json)
        </button>
        
        <button class="btn" id="importBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <path d="M17 8l-5-5-5 5"/>
                <path d="M12 3v12"/>
            </svg>
            Import backup
        </button>
        <input type="file" id="importFile" accept="application/json" hidden>

        <hr>

        <!-- Reset All Data -->
        <button class="btn danger" id="resetBtn">Reset everything</button>
    </aside>

    <!-- ============================================
         4. MODAL OVERLAY (ADD / EDIT SITE)
         ============================================ -->
    <div class="overlay" id="overlay">
        <div class="modal">
            <h2 id="modalTitle">Add site</h2>

            <!-- Site Name -->
            <div class="field">
                <label for="siteName">Name</label>
                <input type="text" id="siteName" placeholder="GitHub">
            </div>

            <!-- Site URL -->
            <div class="field">
                <label for="siteUrl">URL</label>
                <input type="text" id="siteUrl" placeholder="https://github.com">
            </div>

            <!-- Custom Icon Upload (with Preview) -->
            <div class="field">
                <label for="siteIcon">Custom icon (optional)</label>
                <input type="file" id="siteIcon" accept="image/*">
                
                <!-- Preview Container (Toggled via JS) -->
                <div id="iconPreview">
                    <img id="iconPreviewImg" alt="Icon preview">
                    <button type="button" id="removeIconBtn" title="Remove icon">✕</button>
                </div>
            </div>

            <!-- Modal Actions -->
            <div class="actions">
                <button class="cancel" id="modalCancel">Cancel</button>
                <button class="save" id="modalSave">Save</button>
            </div>
        </div>
    </div>

    <!-- ============================================
         5. JAVASCRIPT
         ============================================ -->
    <script src="./js/script.core.js"></script>
    <script src="./js/script.db.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
