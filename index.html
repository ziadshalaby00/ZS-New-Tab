<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>New Tab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Preload script — runs synchronously before the stylesheet
     to prevent accent-color flash.
     Must stay in sync with ZSCore.applyAccent() in js/20-core-theme.js. -->
    <script src="./js/script.preload.js"></script>


    <!-- Main Stylesheet (split files, loaded in order) -->
    <link rel="stylesheet" href="./styles/10-fonts.css">
    <link rel="stylesheet" href="./styles/20-variables.css">
    <link rel="stylesheet" href="./styles/30-base.css">

    <link rel="stylesheet" href="./styles/40-layout.css">
    <link rel="stylesheet" href="./styles/50-topbar.css">
    <link rel="stylesheet" href="./styles/60-hero.css">

    <link rel="stylesheet" href="./styles/70-search.css">
    <link rel="stylesheet" href="./styles/80-grid.css">
    <link rel="stylesheet" href="./styles/90-tiles.css">

    <link rel="stylesheet" href="./styles/100-pagination.css">
    <link rel="stylesheet" href="./styles/110-panel.css">
    <link rel="stylesheet" href="./styles/120-modal.css">

    <link rel="stylesheet" href="./styles/130-background.css">
    <link rel="stylesheet" href="./styles/140-palette.css">
    <link rel="stylesheet" href="./styles/150-responsive.css">

    
</head>
<body>
    <!-- ============================================
         1. TOP BAR (SETTINGS & CONTROLS)
         ============================================ -->
    <div class="top-bar">
        <button class="icon-btn" id="settingsToggle" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>
    </div>

    <!-- ============================================
         2. MAIN APP CONTAINER
         ============================================ -->
    <div class="app">

        <!-- Greeting Section -->
        <div class="hero">
            <div class="greeting" id="greeting">
                <span id="greetingMessage">Hi, </span><span class="name" id="greetName">there</span>
            </div>
        </div>

        <!-- Search Form -->
        <form class="search" id="searchForm" autocomplete="off">
            <select id="engineSelect"></select>
            
            <input id="searchInput" type="text" placeholder="Search or type a URL" autofocus>
            <button type="submit" title="Search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="m21 21-4.3-4.3"/>
                </svg>
            </button>
        </form>

        <!-- Site Grid with Navigation Buttons -->
        <div class="grid-wrap">
            <button class="page-nav" id="prevPage" title="Previous page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m15 18-6-6 6-6"/>
                </svg>
            </button>
            
            <div class="grid" id="grid"></div>
            
            <button class="page-nav" id="nextPage" title="Next page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m9 18 6-6-6-6"/>
                </svg>
            </button>
        </div>

        <!-- Pagination Dots -->
        <div class="dots" id="dots"></div>

    </div>

    <!-- ============================================
         3. SETTINGS PANEL (SLIDE-OUT)
         ============================================ -->
    <aside class="panel" id="panel">
        <button class="panel-close" id="panelClose" title="Close settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6 6 18"/>
                <path d="m6 6 12 12"/>
            </svg>
        </button>

        <h2>Settings</h2>

        <!-- Display Name -->
        <div class="field">
            <label for="displayName">Your name</label>
            <input type="text" id="displayName" placeholder="User">
        </div>

        <!-- Grid Dimensions (Rows & Columns) -->
        <div class="row2">
            <div class="field">
                <label for="rowsInput">Rows per page</label>
                <input type="number" id="rowsInput" min="1" max="20">
            </div>
            <div class="field">
                <label for="colsInput">Columns per page</label>
                <input type="number" id="colsInput" min="1" max="20">
            </div>
        </div>

        <!-- Accent color palette -->
        <div class="field">
            <label>Accent color</label>
            <div class="swatches" id="swatches"></div>
        </div>

        <div class="field">
            <label for="customAccent">Custom color</label>
            <input type="color" id="customAccent" value="#e8a33d">
        </div>

        <!-- Background Image Upload -->
        <div class="field">
            <label for="bgImageInput">Background image</label>
            <input type="file" id="bgImageInput" accept="image/*">
        </div>
        <div class="hint">
            Choose an image from your device. Leave empty to use the default dark background.
        </div>
        <button class="btn danger" id="removeBgBtn">Remove background</button>

        <hr>

        <!-- Export / Import Backup -->
        <button class="btn" id="exportBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <path d="M7 10l5 5 5-5"/>
                <path d="M12 15V3"/>
            </svg>
            Export backup (.json)
        </button>
        
        <button class="btn" id="importBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <path d="M17 8l-5-5-5 5"/>
                <path d="M12 3v12"/>
            </svg>
            Import backup
        </button>
        <input type="file" id="importFile" accept="application/json" hidden>

        <hr>

        <!-- Reset All Data -->
        <button class="btn danger" id="resetBtn">Reset everything</button>
    </aside>

    <!-- ============================================
         3b. PROGRESS BAR (bottom of side panel)
         ============================================ -->
    <div class="panel-progress" id="panelProgress" role="region" aria-live="polite">
        <div class="panel-progress-bar" role="progressbar"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
             id="panelProgressBarEl">
            <div class="panel-progress-fill" id="panelProgressFill"></div>
        </div>
        <div class="panel-progress-label">
            <span id="panelProgressText">Working…</span>
            <span class="percent" id="panelProgressPercent">0%</span>
        </div>
    </div>

    <!-- ============================================
         4. MODAL OVERLAY (ADD / EDIT SITE)
         ============================================ -->
    <div class="overlay" id="overlay">
        <div class="modal">
            <h2 id="modalTitle">Add site</h2>

            <!-- Site Name -->
            <div class="field">
                <label for="siteName">Name</label>
                <input type="text" id="siteName" placeholder="GitHub">
            </div>

            <!-- Site URL -->
            <div class="field">
                <label for="siteUrl">URL</label>
                <input type="text" id="siteUrl" placeholder="https://github.com">
                <div class="field-error" id="siteUrlError"></div>
            </div>

            <!-- Custom Icon Upload (with Preview) -->
            <div class="field">
                <label for="siteIcon">Custom icon (optional)</label>
                <input type="file" id="siteIcon" accept="image/*">
                
                <!-- Preview Container (Toggled via JS) -->
                <div id="iconPreview">
                    <img id="iconPreviewImg" alt="Icon preview">
                    <button type="button" id="removeIconBtn" title="Remove icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6 6 18"/>
                            <path d="m6 6 12 12"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Modal Actions -->
            <div class="actions">
                <button class="cancel" id="modalCancel">Cancel</button>
                <button class="save" id="modalSave">Save</button>
            </div>
        </div>
    </div>

    <!-- ============================================
        5. EXPORT OPTIONS MODAL
        ============================================ -->
    <div class="overlay" id="exportOverlay">
        <div class="modal">
            <h2>Export backup</h2>
            <p class="hint io-hint">Choose where to save your backup file.</p>

            <div class="io-options">
                <button class="io-option" data-target="device">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 3H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h7" />
                        <path d="M12 21H8" />
                        <path d="M10 17v4" />
                        <rect x="11" y="7" width="10" height="14" rx="2" />
                        <line x1="16" y1="18" x2="16.01" y2="18" />
                    </svg>
                    <div class="io-text">
                        <span>Save to device</span>
                        <small>Download a .json file</small>
                    </div>
                </button>

                <button class="io-option" data-target="drive">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="m21.423 13.888-6.09-10.55H8.668l6.09 10.55ZM8.09 4.338 2 14.888l3.334 5.774 6.089-10.55Zm1.733 10.55L6.49 20.662h12.178L22 14.887Z"/>
                    </svg>
                    <div class="io-text">
                        <span>Upload to Google Drive</span>
                        <small>Save to your Drive</small>
                    </div>
                </button>

                <button class="io-option" data-target="both">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3"/>
                        <path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/>
                        <path d="M12 3v18"/>
                    </svg>
                    <div class="io-text">
                        <span>Both</span>
                        <small>Download and upload</small>
                    </div>
                </button>
            </div>

            <div class="actions">
                <button class="cancel" id="exportCancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- ============================================
         6. IMPORT OPTIONS MODAL
         ============================================ -->
    <div class="overlay" id="importOverlay">
        <div class="modal">
            <h2>Import backup</h2>
            <p class="hint io-hint">Choose where to restore your backup from.</p>

            <div class="io-options">
                <button class="io-option" data-source="device">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 3H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h7" />
                        <path d="M12 21H8" />
                        <path d="M10 17v4" />
                        <rect x="11" y="7" width="10" height="14" rx="2" />
                        <line x1="16" y1="18" x2="16.01" y2="18" />
                    </svg>
                    <div class="io-text">
                        <span>From device</span>
                        <small>Pick a .json file</small>
                    </div>
                </button>

                <button class="io-option" data-source="drive">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="m21.423 13.888-6.09-10.55H8.668l6.09 10.55ZM8.09 4.338 2 14.888l3.334 5.774 6.089-10.55Zm1.733 10.55L6.49 20.662h12.178L22 14.887Z"/>
                    </svg>
                    <div class="io-text">
                        <span>From Google Drive</span>
                        <small>Restore from your Drive</small>
                    </div>
                </button>
            </div>

            <div class="actions">
                <button class="cancel" id="importCancel">Cancel</button>
            </div>
        </div>
    </div>
    

    <!-- JavaScript (split files, loaded in order) -->
    <script src="./js/00-init.js"></script>

    <script src="./js/10-core-state.js"></script>
    <script src="./js/20-core-theme.js"></script>
    <script src="./js/30-core-utils.js"></script>

    <script src="./js/40-core-dialog.js"></script>
    <script src="./js/50-core-tiles.js"></script>
    <script src="./js/60-core-renderer.js"></script>

    <script src="./js/70-core-pagination.js"></script>
    <script src="./js/80-core-events.js"></script>
    <script src="./js/90-core-debug.js"></script>

    <script src="./js/100-db.js"></script>

    <script src="./js/105-app-drive-auth.js"></script>
    <script src="./js/107-app-drive-sync.js"></script>
    <script src="./js/110-app-state.js"></script>

    <script src="./js/120-app-render.js"></script>
    <script src="./js/130-app-modal.js"></script>
    <script src="./js/140-app-accent.js"></script>

    <script src="./js/150-app-settings.js"></script>
    <script src="./js/160-app-backup.js"></script>
    <script src="./js/165-app-io.js"></script>

    <script src="./js/166-app-progress.js"></script>
    <script src="./js/170-app-navigation.js"></script>
    <script src="./js/180-app-init.js"></script>
</body>
</html>
